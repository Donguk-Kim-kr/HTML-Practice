<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>패턴</title>

    <style>
        div {
            width: 500px;
            height: 300px;
            margin: 10px;
            border: 1px solid black;
            border-radius: 10px;
        }

        .grad1 {
            background: blue;
            background: repeating-linear-gradient(rgb(95, 255, 95), rgb(95, 255, 95) 20px, rgb(255, 70, 70) 20px, rgb(255, 70, 70) 40px)
        }

        .grad2 {
            background: blue;
            background: repeating-radial-gradient(circle, rgb(95, 255, 95), rgb(255, 255, 108) 10%, rgb(255, 70, 70) 20%);
        }

    </style>
</head>
<body>
    <div class="grad1"></div>
    <div class="grad2"></div>
</body>
</html>
