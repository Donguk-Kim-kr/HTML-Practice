<html lang="ko">
<head>

    <title>속성 선택자</title>
    <style>
        ul {
            list-style: circle;
        }
        li {

        }
        a[href *= "w3"] {

    <ul>
        <li><a href="https://html.spec.whatwg.org">HTML 표준안 사이트</a></li>
        <li><a href="https://caniuse.com">HTML 지원 여부 체크</a></li>
        <li><a href="https://www.w3.org/TR/css3-mediaqueries">HTML 미디어 쿼리</a></li>
    </ul>
