<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>박스 모델 - 마진</title>
    <style>
        * {
            box-sizing: border-box;
        }
        div {
            width: 200px;
            height: 100px;
            margin: 30px;
        }
        #margin1 {
            background-color: blue;
        }
        #margin2 {
            background: fuchsia ;
        }
        #margin3 {
            background: aqua;
        }
    </style>
</head>
<body>
    <div id="margin1"></div>
    <div id="margin2"></div>
    <div id="margin3"></div>
    <div id="margin4"></div>
    <div id="margin5"></div>
</body>
</html>
