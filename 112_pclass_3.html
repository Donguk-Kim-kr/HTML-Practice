<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가상 선택자</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            gap: 20px;
        }
        .container {
            width: 300px;
            padding: 20px;
            border: 1px solid rgb(138, 228, 255);
            border-radius: 5px;
            text-align: center;
        }
        .container p:first-child{
            background-color: rgb(164, 164, 255);
        }
        .container :last-child {
            background-color: rgb(186, 255, 217);
        }
        .container div:only-child {
            background-color: #e6ad88;
        }
    </style>
</head>
<body>
    <div class="container">
        <p>첫 번째</p>
        <div>두 번째</div>
        <p>세 번째</p>
        <div>네 번째</div>
    </div>
    <div class="container">
        <div>혼자</div>
    </div>
    
</body>
</html>
