<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>위치 속성</title>

    <style>
        
        * {
           margin: 0;
           padding: 0; 
        }

        p {
            width: 300px;
            border: 1px solid blue;
            padding: 10px;
        }

        #pos1 {
            position: absolute;
            left: 50px;
            top: 50px;

        }
        #pos2 {
            position: absolute;
            right: 100px;
            top: 200px;
        }
        #pos3 {
            position: absolute;
            left: 100px;
            bottom: 100px;
        }
    </style>
</head>
<body>
    <p id="pos1">하늘 가득히 눈이 휘몰아쳐 흰 사슴을 쏘아가고, 글을 조롱하는 신비한 협객이 푸른 원앙새에 기댄다</p>
    <p id="pos2">하늘 가득히 눈이 휘몰아쳐 흰 사슴을 쏘아가고, 글을 조롱하는 신비한 협객이 푸른 원앙새에 기댄다</p>
    <p id="pos3">하늘 가득히 눈이 휘몰아쳐 흰 사슴을 쏘아가고, 글을 조롱하는 신비한 협객이 푸른 원앙새에 기댄다</p>
</body>
</html>
