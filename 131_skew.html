<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transform</title>
    <style>
        .container {
            width: 800px;
            margin: 20px auto;
        }
        .origin {
            width: 100px;
            height: 100px;
            margin: 40px;
            float: left;
            border: 1px solid black;
            perspective: 200px;
        }
        .origin > div {
            width: 100px;
            height: 100px;
            background-color: orange;
            transition: all 1s;
        }
        #skewx:hover {
            transform: skewX(55deg);
        }
        #skewy:hover {
            transform: skewY(90deg);
        }
        #skewz:hover {
            transform: skew(30deg, 45deg);
        }

    </style>
</head>
<body>
    <div id="container">
        <div class="origin">
            <div id="skewx"></div>
        </div>
        <div class="origin">
            <div id="skewy"></div>
        </div>
        <div class="origin">
            <div id="skewz"></div>
        </div>
    </div>
</body>
</html>
