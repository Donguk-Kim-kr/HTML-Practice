<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>그리드 레이아웃</title>

    <style>
        .gallery {
            width: 700px;
            margin: 20px auto;
            display: grid;
            grid-template-areas: 
            "p1 p1 p2"
            "p1 p1 p3"
            "p4 p5 p6";
            gap: 5px;
        }
        .gallery img {
            width: 100%;
            height: 100%;
            border-radius: 10px;
            object-fit: cover;
        }
        .photo1 {
            grid-area: p1;
        }
        .photo2 {
            grid-area: p2;
        }
        .photo3 {
            grid-area: p3;
        }
        .photo4 {
            grid-area: p4;
        }
        .photo5 {
            grid-area: p5;
        }
        .photo6 {
            grid-area: p6;
        }
    </style>

</head>
<body>
    <div class="gallery">
        <img src="./images/photo-1.jpg" alt="따뜻한 차가 있는 겨울 풍경" class="photo1">
        <img src="./images/photo-2.jpg" alt="남극 펭귄" class="photo2">
        <img src="./images/photo-3.jpg" alt="눈이 가득 쌓인 시골 풍경" class="photo3">
        <img src="./images/photo-4.jpg" alt="오로라가 보이는 밤 풍경" class="photo4">
        <img src="./images/photo-5.jpg" alt="눈 내린 겨울 배경" class="photo5">
        <img src="./images/photo-6.jpg" alt="나뭇가지에 앉아있는 붉은 새" class="photo6">
    </div>
    
</body>
</html>
