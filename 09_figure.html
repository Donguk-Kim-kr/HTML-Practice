<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>제주의 사계절</title>
</head>
<body>
    <h1>제주의 사계절</h1>
    
    <!-- 이미지마다 설명글 -> 구역 : figure -->
    <figure>
        <img src="images\spring.jpg" alt="제주도의 봄" width="400px" height="250px">
        <figcaption></figcaption>
    </figure>
    <figure>
        <img src="images\summer.jpg" alt="제주도의 여름" width="400px" height="250px">
        <figcaption></figcaption>
    </figure>
    <figure>
        <img src="images\autumn.jpg" alt="제주도의 가을" width="400px" height="250px">
        <figcaption></figcaption>
    </figure>
    <figure>
        <img src="images\winter.jpg" alt="제주도의 겨울" width="400px" height="250px">
        <figcaption></figcaption>
    </figure>
    
    <p></p>

    <!-- 여러 이미지를 같은 설명 글 붙이기 -->
    <figure>
        <img src="images\spring2.jpg" alt="제주도의 봄" width="400px" height="250px">
        <img src="images\summer2.jpg" alt="제주도의 여름" width="400px" height="250px">
        <img src="images\autumn2.jpg" alt="제주도의 가을" width="400px" height="250px">
        <img src="images\winter2.jpg" alt="제주도의 겨울" width="400px" height="250px">
    <figcaption>제주도의 사계절</figcaption>
    </figure>

    <p></p>

        <!-- srcset 속성 : 조건에 따라 다른 이미지를 표시한다 -->
        <img src="images\레드향.png" width="800px" height="500px" srcset="images\정답이다 레드향.png" alt="레드향">


</body>
</html>
