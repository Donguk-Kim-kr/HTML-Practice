<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 1000px;
            margin: 10px auto;
            padding: 10px;
            display: grid;
            grid-template-columns: auto;
            grid-template-rows: repeat(3, 250px);
            gap: 0.5rem;
        }
        .item {
            border-radius: 0.5rem;
            font-size: 2rem;
            color: blueviolet;
        }

        .item-1 {
            background-color: antiquewhite;
            grid-column: 1 / 2;
            grid-row: 1 / 3;
        }
        .item-2 {
            background-color: aquamarine;
            grid-column: 2 / 4;
            grid-row: 1 / 2;
        }
        .item-3 {
            background-color: rgb(227, 255, 190);
            grid-column: 2 / 3;
            grid-row: 2 / 3;
        }
        .item-4 {
            background-color: rgb(241, 171, 255);
            grid-column: 3 / 4;
            grid-row: 2 / 3;
        }
        .item-5 {
            background-color: rgba(161, 175, 255, 0.568);
            grid-column: 1 / 4;
            grid-row: 3 / 4;
        }
        @media (max-width: 768px) {
            .container {
                width: 720;
                margin: 10px auto;
                display: block;
            }
            .item {
                height: 200px;
                margin-bottom: 10px;
            }
        }
            @media (max-width: 320px) {
                co
            .container {
                width: 300;
                margin: 10px auto;
                display: block;
            }
            .item {
                height: 100px;
                margin-bottom: 10px;
            }
        }
    </style>

</head>
<body>
    <div class="container">
        <div class="item item-1">item1</div>
        <div class="item item-2">item2</div>
        <div class="item item-3">item3</div>
        <div class="item item-4">item4</div>
        <div class="item item-5">item5</div>
    </div>
</body>
</html>
