<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>고급 선택자</title>

    <style>
        body {
            background-color: bisque;
        }
        section {
            width: 600px;
            margin: 20px auto;
        }
        p {
            width: 500px;
            padding: 10px;
            background-color: aquamarine;
            border: 1px solid black;
            line-height: 2;
        }
        section > p {
            color: blueviolet;
        }
    </style>
</head>
<body>
    <p>처음과 같이 이제와 항상 영원히</p>
    <section>
        <h1>예약 방법 & 사용 요금</h1>
        <p>아직 온라인 예약 신청이 준비되지 않았습니다. <br>전화(010-0000-0000) 문의 부탁드립니다.</p>
        <div>
            <p>가족실(2~4인) : 60,000원/일</p>
            <p>도미토리(4인 공용) : 25,000원/일</p>
        </div>
    </section>
</body>
</html>
