<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 소개 페이지</title>

    <style>
        h1 {
            font-size: 50px;
            color: rgba(192, 144, 236, 0.5);
            margin: 0;
        }
        p {
            font-size: 30px;
        }


        .shadow1 {
            color: red;
            text-shadow: 3px 3px black;
        }
        .shadow2 {
            color: rgb(28, 24, 255);
            text-shadow: 5px 5px 3px rgb(163, 0, 0);
        }
        .shadow3 {
            color: rgb(32, 243, 60);
            text-shadow: 7px -7px 20px rgb(245, 81, 196);
        }
        .trans1 {
            text-transform: capitalize;
        }
        .trans2 {
            text-transform: uppercase;
        }
        .trans3 {
            text-transform: lowercase;
        }
        .spacing1 {
            letter-spacing: 0.2em;
        }
        .spacing2 {
            letter-spacing: 0.1in;
        }
        .spacing3 {
            letter-spacing: 0.2cm;
        }
    </style>

</head>

<body>
    <h1 class="shadow1">HTML</h1>
    <h1 class="shadow2">CSS</h1>
    <h1 class="shadow3">자바스크립트</h1>
    <br>
    <p class="trans1">html</p>
    <p class="trans2">css</p>
    <p class="trans3">JAVASCRIPT</p>
    <br>
    <p>CSS</p>
    <p class="spacing1">CSS</p>
    <p class="spacing2">CSS</p>
    <p class="spacing3">CSS</p>

</body>
</html>
