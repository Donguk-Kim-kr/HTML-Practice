<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>원형 그라데이션</title>

    <style>
        div {
            width: 500px;
            height: 300px;
            margin: 10px;
        }

        .grad1 {
            background: blue;
            background: radial-gradient(rgb(95, 255, 95), rgb(255, 255, 108), rgb(255, 70, 70));
        }

        .grad2 {
            background: blue;
            background: radial-gradient(circle, rgb(95, 255, 95), rgb(255, 255, 108), rgb(255, 70, 70));
        }

    </style>
</head>
<body>
    <div class="grad1"></div>
    <div class="grad2"></div>
</body>
</html>
