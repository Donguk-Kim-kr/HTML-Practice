<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버튼에 동적인 효과 만들기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
    <link rel="stylesheet" href="./PTD/css/font.css">
    <style>
        body {
            background-image: linear-gradient(to right, #ff5e62, #ff9966);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .button {
            text-decoration: none;
            font-family: 'PakrDoyeon', sans-serif;
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: aliceblue;
            outline: 2px solid aliceblue;
            padding: 20px 60px;
            position: relative;
            overflow: hidden;
            transition: color 1s;
        }
        .button::before {
            content: "";
            position: absolute;
            top: 0;
            left: -50px;
            width: 0;
            height: 100%;
            background-color: white;
            z-index: -10;
            transform: skewX(35deg);
            transition: width 1s;
        }
        .button:hover {
            color: #ff5e62;
        }
        .button:hover::before {
            width: 100%;            
        }
    </style>
</head>
<body>
    <a href="#" class="button">둘러보기</a>
</body>
</html>
