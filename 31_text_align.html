<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>상품 소개 페이지</title>

    <!-- 내부 CSS 스타일 시트 -->
    <style>
        body {
            background: url('./images/bg-2.jpg') no-repeat fixed;
            background-size: cover;
        }
        h1 {
            font-size: 180px;
            color: rgb(192, 144, 236, 0.5);
        }
        p {
            width:4 10px;
            border: 1px solid rgb(45, 137, 230);
            padding: 10px;
            margin: 10px;
            font-size: 1.1em;
        }
        .center {
            text-align: center;
        }
    </style>

</head>
<body>
    <h1>CSS</h1>
    <p>껍질에 붉은 빛이 돌아 레드향이라 불린다. <b>레드향</b>은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~5배 크고, 과육이 붉고 통통하다.</p>
    <p class="center">껍질에 붉은 빛이 돌아 레드향이라 불린다. <b>레드향</b>은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~5배 크고, 과육이 붉고 통통하다.</p>
    <p class="justify">껍질에 붉은 빛이 돌아 레드향이라 불린다. <b>레드향</b>은 한라봉과 귤을 교배한 것으로 일반 귤보다 2~5배 크고, 과육이 붉고 통통하다.</p>
</body>
</html>
